<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StormBox — Ask</title>
  <style>
    :root {
      --bg:      #111;
      --surface: #1e1e1e;
      --text:    #f0f0f0;
      --muted:   #777;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 1rem 0.75rem;
      flex-shrink: 0;
    }
    .topbar-title { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em; flex: 1; }
    .status-label { font-size: 0.72rem; font-weight: 500; white-space: nowrap; transition: color 0.3s; }
    .status-label.ok  { color: #4caf50; }
    .status-label.err { color: #f44336; }

    /* ── Message list ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 1rem;
      display: flex;
      flex-direction: column;
    }

    .bubble {
      display: flex;
      margin-bottom: 0.5rem;
    }
    .bubble.user { justify-content: flex-end; }
    .bubble.bot  { justify-content: flex-start; }

    .bubble-inner {
      max-width: 78%;
      padding: 0.6rem 0.9rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }
    .bubble.user .bubble-inner {
      background: #1565c0;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.bot .bubble-inner {
      background: var(--surface);
      border-bottom-left-radius: 4px;
    }
    .bubble.thinking .bubble-inner {
      font-style: italic;
      color: var(--muted);
    }

    .sources {
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.15rem 0.5rem 0.5rem 0.5rem;
      line-height: 1.4;
    }

    /* ── Suggested questions ── */
    #suggestions {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.5rem 1rem 0.75rem;
    }
    .suggestion-chip {
      background: transparent;
      border: 1.5px solid #333;
      border-radius: 999px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.3;
    }
    .suggestion-chip:active { background: var(--surface); }

    /* ── Input bar (sits above fixed nav) ── */
    .input-bar {
      flex-shrink: 0;
      padding: 0.6rem 1rem;
      padding-bottom: calc(0.6rem + 56px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid #222;
      background: var(--bg);
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    #ask-input {
      flex: 1;
      background: var(--surface);
      border: none;
      border-radius: 22px;
      padding: 0.65rem 1rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    #ask-input::placeholder { color: var(--muted); }
    #ask-input:disabled { opacity: 0.5; }
    #send-btn {
      background: #1565c0;
      color: #fff;
      border: none;
      border-radius: 22px;
      padding: 0.65rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    #send-btn:disabled { opacity: 0.4; cursor: default; }
    #send-btn:active:not(:disabled) { background: #0d47a1; }

    /* ── Voice: mic button, status line, "heard by Whisper" note ── */
    #mic-btn {
      width: 44px; height: 44px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface); color: var(--text);
      border: 1.5px solid #333; border-radius: 50%;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #mic-btn svg { width: 20px; height: 20px; }
    #mic-btn:active:not(:disabled) { background: #2a2a2a; }
    #mic-btn:disabled { opacity: 0.4; cursor: default; }
    #mic-btn.unavailable { opacity: 0.45; }
    #mic-btn.recording {
      background: #c62828; border-color: #c62828; color: #fff;
      animation: mic-pulse 1.2s ease-in-out infinite;
    }
    #mic-btn.busy { opacity: 0.6; cursor: default; }
    @keyframes mic-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0.55); }
      70%  { box-shadow: 0 0 0 10px rgba(198, 40, 40, 0); }
      100% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0); }
    }
    @media (prefers-reduced-motion: reduce) { #mic-btn.recording { animation: none; } }
    .voice-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.35rem; }
    .voice-status {
      flex: 1; min-height: 1.1rem;
      font-size: 0.78rem; color: var(--muted); line-height: 1.3;
    }
    .speak-toggle {
      display: flex; align-items: center; gap: 0.3rem; flex-shrink: 0;
      font-size: 0.72rem; color: var(--muted); cursor: pointer; user-select: none;
    }
    .speak-toggle input { accent-color: #1565c0; }

    /* 🔊 button under every answer */
    .answer-tools { padding: 0.2rem 0.5rem 0 0.5rem; }
    .speak-btn {
      width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--muted);
      border: 1.5px solid #333; border-radius: 50%;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .speak-btn svg { width: 15px; height: 15px; }
    .speak-btn:active { background: var(--surface); }
    .speak-btn.loading { opacity: 0.55; animation: speak-blink 1s ease-in-out infinite; }
    .speak-btn.playing { color: #fff; background: #1565c0; border-color: #1565c0; }
    @keyframes speak-blink { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) { .speak-btn.loading { animation: none; } }
    .voice-status.recording { color: #ef5350; }
    .voice-status.error { color: #ff8a80; }
    .voice-note {
      font-size: 0.7rem; color: var(--muted);
      text-align: right; padding: 0 0.5rem 0.4rem 0;
    }

    /* ── Bottom nav bar ── */
    .nav-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }
    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 0.6rem 0;
      min-height: 56px;
      text-decoration: none;
      color: #666;
      font-size: 0.68rem;
      font-weight: 500;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-tab svg    { width: 22px; height: 22px; }
    .nav-tab.active { color: #fff; }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="topbar-title">StormBox</span>
    <span class="status-label err" id="status-label">● Reconnecting to box...</span>
  </div>

  <div id="messages"></div>

  <div id="suggestions">
    <button class="suggestion-chip">Is the storm over?</button>
    <button class="suggestion-chip">What do I do if water comes in?</button>
    <button class="suggestion-chip">How much water do we need?</button>
    <button class="suggestion-chip">How long will the battery last?</button>
  </div>

  <div class="input-bar">
    <div class="voice-row">
      <div class="voice-status" id="voice-status" role="status" aria-live="polite"></div>
      <label class="speak-toggle" id="auto-speak-label" title="Speak every new answer out loud">
        <input type="checkbox" id="auto-speak"> Read answers aloud
      </label>
    </div>
    <div class="input-row">
      <button id="mic-btn" type="button" aria-label="Ask by voice" aria-pressed="false" title="Ask by voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
      </button>
      <input type="text" id="ask-input" placeholder="Ask the box anything…" autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <nav class="nav-bar">
    <a href="index.html" class="nav-tab">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L11 3l8 7"/><path d="M5 8.7V19h4v-5h4v5h4V8.7"/></svg>
      <span>Home</span>
    </a>
    <a href="ask.html" class="nav-tab active">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H8l-4 3V5a1 1 0 0 1 1-1z"/></svg>
      <span>Ask</span>
    </a>
    <a href="supplies.html" class="nav-tab">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="16" height="10" rx="1"/><path d="M8 9V6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><line x1="3" y1="13" x2="19" y2="13"/></svg>
      <span>Supplies</span>
    </a>
    <a href="guides.html" class="nav-tab">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h5a3 3 0 0 1 2 1 3 3 0 0 1 2-1h5v14h-5a3 3 0 0 0-2 1 3 3 0 0 0-2-1H4V3z"/><line x1="11" y1="4" x2="11" y2="17"/></svg>
      <span>Guides</span>
    </a>
  </nav>

  <script src="js/state.js"></script>
  <script src="js/voice.js"></script>
  <script>
    var input       = document.getElementById("ask-input");
    var sendBtn     = document.getElementById("send-btn");
    var messages    = document.getElementById("messages");
    var suggestions = document.getElementById("suggestions");

    function scrollBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function addUserBubble(text) {
      var div = document.createElement("div");
      div.className = "bubble user";
      var inner = document.createElement("div");
      inner.className = "bubble-inner";
      inner.textContent = text;
      div.appendChild(inner);
      messages.appendChild(div);
      scrollBottom();
      return div;
    }

    // Small grey line under a spoken question: which engine heard it and how long it took.
    function addVoiceNote(sttMs) {
      var note = document.createElement("div");
      note.className = "voice-note";
      note.textContent = "Heard by Whisper (offline) in " + (sttMs / 1000).toFixed(1) + " s";
      messages.appendChild(note);
      scrollBottom();
    }

    // Returns the wrapper element so it can be updated later.
    function addBotBubble(text, sources, thinking) {
      var wrap  = document.createElement("div");
      var div   = document.createElement("div");
      div.className = "bubble bot" + (thinking ? " thinking" : "");
      var inner = document.createElement("div");
      inner.className = "bubble-inner";
      inner.textContent = text;
      div.appendChild(inner);
      wrap.appendChild(div);
      if (sources && sources.length) {
        wrap.appendChild(makeSources(sources));
      }
      messages.appendChild(wrap);
      scrollBottom();
      return wrap;
    }

    function makeSources(sources) {
      var el = document.createElement("div");
      el.className = "sources";
      var titles = sources.map(function(s) { return s.title || ""; }).filter(Boolean);
      if (titles.length) el.textContent = "Sources: " + titles.join(", ");
      return el;
    }

    function updateBotBubble(wrap, text, sources, traceId) {
      var div = wrap.querySelector(".bubble");
      div.className = "bubble bot";
      div.querySelector(".bubble-inner").textContent = text;
      var oldTools = wrap.querySelector(".answer-tools");
      if (oldTools) oldTools.remove();
      if (traceId != null && ttsReady) {                   // a real answer (not an error message): add the 🔊 button
        div.parentNode.insertBefore(makeSpeakTools(text, traceId), div.nextSibling);
      }
      var old = wrap.querySelector(".sources");
      if (old) old.remove();
      if (sources && sources.length) {
        var el = makeSources(sources);
        if (el.textContent) wrap.appendChild(el);
      }
      scrollBottom();
    }

    // voice (optional) = {stt_ms} when the question was spoken. Typed questions call send() with nothing.
    function send(voice) {
      var text = input.value.trim();
      if (!text || sendBtn.disabled) return;
      input.value = "";

      stopSpeaking();
      addUserBubble(text);
      if (voice) addVoiceNote(voice.stt_ms);
      suggestions.style.display = "none";
      var thinkingWrap = addBotBubble("Thinking…", [], true);

      input.disabled  = true;
      sendBtn.disabled = true;
      micBtn.disabled  = true;          // no recording while the agent is thinking

      var controller = new AbortController();
      var timer = setTimeout(function() { controller.abort(); }, 60000);

      fetch("/api/ask", {
        method:  "POST",
        headers: {"Content-Type": "application/json"},
        body:    JSON.stringify(voice
                   ? {text: text, channel: "voice", stt_ms: voice.stt_ms}
                   : {text: text}),
        signal:  controller.signal,
      })
        .then(function(r) {
          clearTimeout(timer);
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function(data) {
          updateBotBubble(thinkingWrap, data.answer || "(no answer)", data.sources || [], data.trace_id);
          dbg("answer arrived. auto-read ticked:", autoSpeak.checked, "| channel:", voice ? "voice" : "typed",
              "| speaker button present:", !!thinkingWrap.querySelector(".speak-btn"));
          if (autoSpeak.checked && data.answer && data.trace_id != null) {
            toggleSpeak(thinkingWrap.querySelector(".speak-btn"), data.answer, data.trace_id);
          }
        })
        .catch(function() {
          clearTimeout(timer);
          updateBotBubble(
            thinkingWrap,
            "Sorry, the assistant didn't respond. Try again.",
            []
          );
        })
        .finally(function() {
          input.disabled  = false;
          sendBtn.disabled = false;
          micBtn.disabled  = false;
          input.focus();
        });
    }

    Array.prototype.forEach.call(
      suggestions.querySelectorAll(".suggestion-chip"),
      function(chip) {
        chip.addEventListener("click", function() {
          input.value = chip.textContent;
          send();
        });
      }
    );

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") send();
    });
    sendBtn.addEventListener("click", function() { send(); });

    // ── Voice: tap the mic to start, tap again to stop. The words are transcribed offline by
    //    Whisper on the box, put in the chat, and sent automatically.
    var micBtn      = document.getElementById("mic-btn");
    var voiceStatus = document.getElementById("voice-status");
    var micState    = "idle";           // idle | recording | transcribing
    var micBlocked  = null;             // reason text when voice cannot work here (HTTPS, models, browser)

    function setVoice(state, text, kind) {
      micState = state;
      micBtn.classList.toggle("recording", state === "recording");
      micBtn.classList.toggle("busy", state === "transcribing");
      micBtn.setAttribute("aria-pressed", state === "recording" ? "true" : "false");
      micBtn.setAttribute("aria-label", state === "recording" ? "Stop recording" : "Ask by voice");
      voiceStatus.className = "voice-status" + (kind ? " " + kind : "");
      voiceStatus.textContent = text || "";
      input.disabled   = (state !== "idle");
      sendBtn.disabled = (state !== "idle");
    }

    function micFail(message) {
      setVoice("idle", message, "error");
      input.focus();
    }

    function stopAndSend() {
      StormVoice.stop().then(function(rec) {
        if (!rec) { setVoice("idle", ""); return; }
        if (rec.seconds < StormVoice.MIN_SECONDS) { micFail("That was too short. Tap the mic and speak, then tap again."); return; }
        setVoice("transcribing", "Transcribing…");
        return StormVoice.transcribe(rec.blob).then(function(result) {
          var text = (result.text || "").trim();
          if (!/[a-z0-9]/i.test(text)) { micFail("I didn't hear anything. Tap the mic and try again."); return; }
          setVoice("idle", "");
          input.value = text;             // the words appear in the chat box...
          send({stt_ms: result.stt_ms});  // ...and are sent right away
        });
      }).catch(function(e) { micFail(e.message || "Voice failed. Please try again."); });
    }

    micBtn.addEventListener("click", function() {
      if (micBlocked) { voiceStatus.className = "voice-status error"; voiceStatus.textContent = micBlocked; return; }
      if (micState === "recording") { stopAndSend(); return; }
      if (micState !== "idle" || micBtn.disabled) return;
      stopSpeaking();                   // don't let the box's own voice leak into the recording
      setVoice("idle", "Starting the microphone…");
      StormVoice.start(
        function(secs) { voiceStatus.textContent = "Listening… " + secs.toFixed(0) + " s (tap the mic to stop)"; },
        stopAndSend                               // hit the time limit: stop and send automatically
      ).then(function() {
        setVoice("recording", "Listening… (tap the mic to stop)", "recording");
      }, function(e) { micFail(e.message); });
    });

    // Decide once, at load, whether the mic can work here. Typing always works.
    (function() {
      var s = StormVoice.supported();
      if (!s.ok) { micBlocked = s.reason; micBtn.classList.add("unavailable"); return; }
      fetch("/api/voice/status").then(function(r) { return r.json(); }).then(function(v) {
        if (!v.tts_ready) {                       // no Piper voice: hide the speaker features
          ttsReady = false;
          document.getElementById("auto-speak-label").style.display = "none";
        }
        if (!v.stt_ready) {
          micBlocked = "Voice models are not installed on the box. Run: python ai/scripts/download_voice_models.py";
          micBtn.classList.add("unavailable");
        }
      }).catch(function() { /* old server without voice routes: leave the button; the click will explain */ });
    })();

    window.addEventListener("pagehide", function() { StormVoice.cancel(); stopSpeaking(); });   // release the mic

    // ── Speaking answers (Piper, offline). One answer plays at a time; clicking the playing one stops it.
    //    The audio for each answer is fetched once and kept, so replaying is instant.
    // Debug lines for the Console (F12). They help find why a sound did not play on a given machine.
    function dbg() { try { console.log.apply(console, ["[speak]"].concat([].slice.call(arguments))); } catch (e) {} }

    var ttsReady    = true;             // set false if the server says the Piper voice is missing
    var autoSpeak   = document.getElementById("auto-speak");
    var currentBtn  = null;             // the 🔊 button whose answer is loading or playing
    var currentAudio = null;

    var ICON_SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
    var ICON_STOP    = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

    function setSpeakState(btn, state) {                  // idle | loading | playing
      btn.classList.toggle("loading", state === "loading");
      btn.classList.toggle("playing", state === "playing");
      btn.innerHTML = state === "playing" ? ICON_STOP : ICON_SPEAKER;
      var label = state === "playing" ? "Stop reading" : "Read this answer aloud";
      btn.setAttribute("aria-label", label);
      btn.title = state === "loading" ? "Preparing speech…" : label;
    }

    function stopSpeaking() {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      if (currentBtn) { setSpeakState(currentBtn, "idle"); currentBtn = null; }
    }

    // Text -> audio URL. Piper cleans the text first (no "hPa", no source lines). Cached on the button.
    function getAudioUrl(btn, text, traceId) {
      if (btn._url) return Promise.resolve(btn._url);
      if (btn._pending) return btn._pending;
      btn._pending = fetch("/api/voice/tts", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: text, trace_id: traceId})      // trace_id: saves the speech time in the trace
      }).then(function(r) {
        if (r.ok) return r.blob();
        return r.json().then(function(j) { throw new Error(j.detail || "Could not make speech."); },
                             function() { throw new Error("Could not make speech (HTTP " + r.status + ")."); });
      }).then(function(blob) {
        btn._url = URL.createObjectURL(blob);
        btn._pending = null;
        return btn._url;
      }, function(e) { btn._pending = null; throw e; });
      return btn._pending;
    }

    function toggleSpeak(btn, text, traceId) {
      if (!btn) return;
      if (currentBtn === btn) { dbg("clicked again -> stop"); stopSpeaking(); return; }   // second click = stop
      stopSpeaking();                                              // only one answer at a time
      currentBtn = btn;
      setSpeakState(btn, "loading");
      dbg("start, trace", traceId, btn._url ? "(cached audio)" : "(fetching audio)");
      getAudioUrl(btn, text, traceId).then(function(url) {
        if (currentBtn !== btn) { dbg("another button took over while loading"); return; }   // user clicked something else
        var audio = new Audio(url);
        currentAudio = audio;
        ["play", "playing", "pause", "ended", "error", "stalled"].forEach(function(ev) {
          audio.addEventListener(ev, function() {
            dbg("audio event:", ev, "t=" + audio.currentTime.toFixed(2), "of " + (audio.duration || 0).toFixed(2) + " s",
                "volume=" + audio.volume, "muted=" + audio.muted);
          });
        });
        audio.onended = function() { if (currentBtn === btn) stopSpeaking(); };
        setSpeakState(btn, "playing");
        return audio.play().then(function() { dbg("play() accepted"); });
      }).catch(function(e) {
        dbg("FAILED:", e && e.name, e && e.message);
        if (currentBtn === btn) { currentBtn = null; currentAudio = null; setSpeakState(btn, "idle"); }
        voiceStatus.className = "voice-status error";
        voiceStatus.textContent = (e && e.name === "NotAllowedError")
          ? "Your browser blocked automatic sound. Tap the speaker button under the answer to hear it."
          : (e.message || "Could not play that answer.");
      });
    }

    function makeSpeakTools(text, traceId) {
      var tools = document.createElement("div");
      tools.className = "answer-tools";
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "speak-btn";
      setSpeakState(btn, "idle");
      btn.addEventListener("click", function() { toggleSpeak(btn, text, traceId); });
      tools.appendChild(btn);
      return tools;
    }

    // Remember the "Read answers aloud" choice in this browser (storage can be blocked: ignore errors).
    try { autoSpeak.checked = localStorage.getItem("stormbox.autoSpeak") === "1"; } catch (e) {}
    autoSpeak.addEventListener("change", function() {
      try { localStorage.setItem("stormbox.autoSpeak", autoSpeak.checked ? "1" : "0"); } catch (e) {}
      if (!autoSpeak.checked) stopSpeaking();
    });

    connectState(function(state) {
      var el = document.getElementById("status-label");
      if (state._connected) {
        el.className   = "status-label ok";
        el.textContent = "● Connected to box";
      } else {
        el.className   = "status-label err";
        el.textContent = "● Reconnecting to box...";
      }
    });
  </script>

</body>
</html>
