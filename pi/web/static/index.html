<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StormBox</title>
  <style>
    :root {
      --bg:           #111;
      --surface:      #1e1e1e;
      --text:         #f0f0f0;
      --muted:        #777;
      --card-clear:   #1b5e20;
      --card-warn:    #e65100;
      --card-alarm:   #b71c1c;
      --card-off:     #1e1e1e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 1rem;
      min-height: 100dvh;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 0 0.75rem;
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      flex: 1;
    }

    .badge {
      font-size: 0.68rem;
      font-weight: 500;
      background: #2a2a2a;
      color: var(--muted);
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.ok  { background: #4caf50; }
    .dot.err { background: #f44336; }

    /* ── Status card ── */
    .card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-radius: 20px;
      padding: 2.5rem 1.75rem;
      margin-bottom: 1.5rem;
      transition: background 0.35s ease;
      min-height: 260px;
    }

    .card.clear { background: var(--card-clear); }
    .card.warn  { background: var(--card-warn);  }
    .card.alarm { background: var(--card-alarm); }
    .card.off   { background: var(--card-off);   }

    .card-title {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 0.85rem;
    }

    .card-action {
      font-size: 1.1rem;
      line-height: 1.5;
      opacity: 0.88;
    }

    /* Disconnected state — muted, no action text */
    .card.off .card-title  { color: var(--muted); font-size: 1.5rem; font-weight: 600; }
    .card.off .card-action { display: none; }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="topbar-title">StormBox</span>
    <span class="badge">Works offline</span>
    <span class="dot err" id="dot"></span>
  </div>

  <div class="card off" id="card">
    <div class="card-title" id="card-title">Connecting…</div>
    <div class="card-action" id="card-action"></div>
  </div>

  <script src="js/state.js"></script>
  <script>
    var card       = document.getElementById("card");
    var cardTitle  = document.getElementById("card-title");
    var cardAction = document.getElementById("card-action");
    var dot        = document.getElementById("dot");

    function severityClass(state) {
      var active = (state.alarms || []).filter(function (a) { return !a.acked; });
      if (active.some(function (a) { return a.level === "alarm"; })) return "alarm";
      if (active.some(function (a) { return a.level === "warn";  })) return "warn";
      return "clear";
    }

    connectState(function (state) {
      if (!state._connected) {
        dot.className        = "dot err";
        card.className       = "card off";
        cardTitle.textContent  = "Reconnecting…";
        cardAction.textContent = "";
        return;
      }

      dot.className = "dot ok";

      var sc = state.status_card || {};
      cardTitle.textContent  = sc.title  || "—";
      cardAction.textContent = sc.action || "";
      card.className = "card " + severityClass(state);
    });
  </script>

</body>
</html>
