<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StormBox</title>
  <style>
    :root {
      --bg:           #111;
      --surface:      #1e1e1e;
      --text:         #f0f0f0;
      --muted:        #777;
      --card-clear:   #1b5e20;
      --card-warn:    #e65100;
      --card-alarm:   #b71c1c;
      --card-off:     #1e1e1e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 1rem calc(4rem + env(safe-area-inset-bottom));
      min-height: 100dvh;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 0 0.75rem;
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      flex: 1;
    }

    .status-label {
      font-size: 0.72rem;
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.3s;
    }
    .status-label.ok  { color: #4caf50; }
    .status-label.err { color: #f44336; }

    .net-line {
      font-size: 0.75rem;
      padding-bottom: 0.5rem;
      flex-shrink: 0;
    }

    /* ── Status card ── */
    .card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-radius: 20px;
      padding: 2.5rem 1.75rem;
      margin-bottom: 1rem;
      transition: background 0.35s ease;
      min-height: 260px;
    }

    .card.clear { background: var(--card-clear); }
    .card.warn  { background: var(--card-warn);  }
    .card.alarm { background: var(--card-alarm); }
    .card.off   { background: var(--card-off);   }

    .card-title {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 0.85rem;
    }

    .card-action {
      font-size: 1.1rem;
      line-height: 1.5;
      opacity: 0.88;
    }

    .card-silenced {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-top: 0.5rem;
      font-style: italic;
    }

    /* Disconnected state */
    .card.off .card-title  { color: var(--muted); font-size: 1.5rem; font-weight: 600; }
    .card.off .card-action { display: none; }

    /* ── Pulse animation — background color only, text stays white ── */
    @keyframes pulse-alarm {
      0%, 100% { background: var(--card-alarm); }
      50%       { background: #7f0000; }
    }
    @keyframes pulse-warn {
      0%, 100% { background: var(--card-warn); }
      50%       { background: #bf360c; }
    }
    .card.alarm.pulsing { animation: pulse-alarm 2s ease-in-out infinite; }
    .card.warn.pulsing  { animation: pulse-warn  2s ease-in-out infinite; }

    /* ── Silence button ── */
    .silence-btn {
      display: none;
      width: 100%;
      padding: 0.9rem;
      margin-bottom: 0.75rem;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .silence-btn:active { background: #ddd; }
    .silence-btn:disabled { opacity: 0.5; cursor: default; }

    /* ── Secondary alarm tags ── */
    .alarm-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    .alarm-tag {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.28rem 0.7rem;
      border-radius: 999px;
      border: 1.5px solid;
    }
    .alarm-tag.alarm { color: #ff8a80; border-color: #ff8a80; }
    .alarm-tag.warn  { color: #ffb74d; border-color: #ffb74d; }
    .alarm-tag.acked { opacity: 0.45; }

    /* ── Readings grid ── */
    .readings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .reading-tile {
      background: var(--surface);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      border: 2px solid transparent;
      transition: border-color 0.3s;
    }
    .tile-label {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.3rem;
    }
    .tile-value {
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1.1;
    }
    .tile-sub {
      font-size: 0.72rem;
      margin-top: 0.25rem;
      line-height: 1.2;
    }
    .reading-tile.tile-alarm { border-color: #f44336; }
    .reading-tile.tile-warn  { border-color: #ff9800; }
    .floor-wet  { color: #f44336; }
    .floor-damp { color: #ff9800; }
    .floor-dry  { color: #4caf50; }
    .feels-caution  { color: #ff9800; }
    .feels-danger   { color: #f44336; }
    .trend-up   { color: #64b5f6; }
    .trend-down { color: #ff9800; }
    .trend-flat { color: var(--muted); }

    /* ── Compact card when all-clear ── */
    .card.no-alarm {
      min-height: 140px;
      padding: 1.25rem 1.75rem;
    }

    /* ── Storm strip (compact one-liner under the status card) ── */
    .storm-strip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      padding: 0.35rem 0.25rem;
      margin-bottom: 0.75rem;
    }
    .storm-strip.amber { color: #ff9800; }
    .storm-strip.muted { color: var(--muted); }

    /* ── Alarm explanation strip ── */
    .explanation-strip {
      background: var(--surface);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      line-height: 1.55;
      margin-bottom: 0.75rem;
      opacity: 0.9;
    }

    /* ── Bottom nav bar ── */
    .nav-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }
    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 0.6rem 0;
      min-height: 56px;
      text-decoration: none;
      color: #666;
      font-size: 0.68rem;
      font-weight: 500;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-tab svg    { width: 22px; height: 22px; }
    .nav-tab.active { color: #fff; }

    /* ── Replay banner ── */
    #replay-banner {
      display: none;
      margin: 0 -1rem 0.75rem;
      padding: 0.6rem 1rem;
      background: #b71c1c;
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

  <div id="replay-banner">REPLAY: <span id="replay-banner-name"></span></div>

  <div class="topbar">
    <span class="topbar-title">StormBox</span>
    <span class="status-label err" id="status-label">● Reconnecting to box...</span>
  </div>

  <div class="net-line" id="net-line" style="display:none"></div>

  <div class="card off" id="card">
    <div class="card-title" id="card-title">Connecting…</div>
    <div class="card-action" id="card-action"></div>
    <div class="card-silenced" id="card-silenced" style="display:none">Alarm silenced</div>
  </div>

  <div class="storm-strip muted" id="storm-row"></div>

  <div class="explanation-strip" id="explanation-strip" style="display:none"></div>
  <button class="silence-btn" id="silence-btn">Silence alarm</button>
  <div class="alarm-tags" id="alarm-tags"></div>
  <div class="readings-grid" id="readings-grid"></div>

  <nav class="nav-bar">
    <a href="index.html" class="nav-tab active">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10L11 3l8 7"/><path d="M5 8.7V19h4v-5h4v5h4V8.7"/></svg>
      <span>Home</span>
    </a>
    <a href="ask.html" class="nav-tab">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H8l-4 3V5a1 1 0 0 1 1-1z"/></svg>
      <span>Ask</span>
    </a>
    <a href="supplies.html" class="nav-tab">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="16" height="10" rx="1"/><path d="M8 9V6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><line x1="3" y1="13" x2="19" y2="13"/></svg>
      <span>Supplies</span>
    </a>
    <a href="guides.html" class="nav-tab">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h5a3 3 0 0 1 2 1 3 3 0 0 1 2-1h5v14h-5a3 3 0 0 0-2 1 3 3 0 0 0-2-1H4V3z"/><line x1="11" y1="4" x2="11" y2="17"/></svg>
      <span>Guides</span>
    </a>
  </nav>

  <script src="js/state.js"></script>
  <script>
    var replayBanner     = document.getElementById("replay-banner");
    var replayBannerName = document.getElementById("replay-banner-name");

    // Map file -> "Storm Year" for the replay banner label
    var _replayNames = {};
    fetch("/api/replay/list")
      .then(function (r) { return r.json(); })
      .then(function (list) {
        list.forEach(function (item) {
          _replayNames[item.file] = item.storm + " " + item.year;
        });
      })
      .catch(function () {});

    var card              = document.getElementById("card");
    var cardTitle         = document.getElementById("card-title");
    var cardAction        = document.getElementById("card-action");
    var cardSilenced      = document.getElementById("card-silenced");
    var statusLabel       = document.getElementById("status-label");
    var explanationStrip  = document.getElementById("explanation-strip");
    var silenceBtn        = document.getElementById("silence-btn");
    var alarmTags         = document.getElementById("alarm-tags");
    var readingsGrid      = document.getElementById("readings-grid");
    var stormRow          = document.getElementById("storm-row");

    // Same priority order as state.py _CARD_PRIORITY
    var PRIORITY = [
      "flood:alarm", "wind:alarm", "storm:alarm", "heat:alarm",
      "flood:warn",  "wind:warn",  "storm:warn",  "heat:warn",
    ];

    function priorityOf(alarm) {
      var i = PRIORITY.indexOf(alarm.id + ":" + alarm.level);
      return i === -1 ? 99 : i;
    }

    function sortedActive(alarms) {
      return (alarms || [])
        .filter(function (a) { return !a.acked; })
        .slice()
        .sort(function (a, b) { return priorityOf(a) - priorityOf(b); });
    }

    function severityClass(active) {
      if (active.some(function (a) { return a.level === "alarm"; })) return "alarm";
      if (active.some(function (a) { return a.level === "warn";  })) return "warn";
      return "clear";
    }

    // Track last alarms so the button click can read them
    var _lastAlarms      = [];
    var _pressureHistory = [];

    // Returns border class for a tile based on active (non-acked) alarms
    function tileBorderClass(alarmId) {
      var found = (_lastAlarms || []).filter(function (a) {
        return a.id === alarmId && !a.acked;
      });
      if (!found.length) return "";
      return found.some(function (a) { return a.level === "alarm"; }) ? " tile-alarm" : " tile-warn";
    }

    function renderReadings(state) {
      var r = state.readings || {};

      // Rolling pressure history for trend arrow (sea-level pressure)
      if (r.p_sl != null) {
        _pressureHistory.push(r.p_sl);
        if (_pressureHistory.length > 5) _pressureHistory.shift();
      }
      var trend = "";
      if (_pressureHistory.length >= 2) {
        var diff = _pressureHistory[_pressureHistory.length - 1] - _pressureHistory[0];
        if      (diff >  0.1) trend = " <span class='trend-up'>↑</span>";
        else if (diff < -0.1) trend = " <span class='trend-down'>↓</span>";
        else                  trend = " <span class='trend-flat'>→</span>";
      }

      var tempF   = r.temp != null ? Math.round(r.temp * 9 / 5 + 32) + "°F" : "—";
      var windStr = r.wind != null ? r.wind.toFixed(1) : "—";
      var humStr  = r.hum  != null ? r.hum.toFixed(1) + "%" : "—";
      var presStr = r.p_sl != null ? r.p_sl.toFixed(1) : "—";

      var esp32Up = !!(state.health && state.health.esp32_link);

      // Floor: dry/damp/wet word computed on the Pi from CS 2's floor_state()
      var floorWord = r.floor_word;
      var floorHtml = !esp32Up ? "—"
        : floorWord === "wet"  ? "<span class='floor-wet'>Wet</span>"
        : floorWord === "damp" ? "<span class='floor-damp'>Damp</span>"
        : floorWord === "dry"  ? "<span class='floor-dry'>Dry</span>"
        : "—";

      // Feels like: label and category from Pi-computed heat_info()
      var feelsLabel = r.feels_like || null;
      var feelsCat   = r.feels_like_cat || "";
      var feelsClass = (feelsCat === "Danger" || feelsCat === "Extreme Danger") ? "feels-danger"
                     : feelsCat !== "none" && feelsCat !== "" ? "feels-caution" : "";
      // Extract just the "XX°F" part from the full label string (e.g. "Feels like 98°F · Extreme Caution")
      var feelsTemp  = feelsLabel ? (feelsLabel.match(/\d+°F/) || [tempF])[0] : tempF;
      var feelsCautionLine = (feelsCat && feelsCat !== "none" && feelsCat !== "")
        ? "<div class='tile-sub " + feelsClass + "'>" + feelsCat + "</div>"
        : "";
      var feelsTile  = "<div class='reading-tile" + tileBorderClass("heat") + "'>"
        + "<div class='tile-label'>Feels like</div>"
        + "<div class='tile-value " + feelsClass + "'>" + feelsTemp + "</div>"
        + feelsCautionLine
        + "</div>";

      function tile(label, valueHtml, alarmId) {
        return "<div class='reading-tile" + (alarmId ? tileBorderClass(alarmId) : "") + "'>"
          + "<div class='tile-label'>" + label + "</div>"
          + "<div class='tile-value'>" + valueHtml + "</div>"
          + "</div>";
      }

      readingsGrid.innerHTML = [
        tile("Pressure (sea lvl)", presStr + trend, "storm"),
        tile("Wind (mph)",         windStr,         "wind"),
        feelsTile,
        tile("Temperature",        tempF,           "heat"),
        tile("Humidity",           humStr,          "heat"),
        tile("Floor",              floorHtml,       "flood"),
      ].join("");
    }

    // Returns the single highest-priority alarm regardless of acked status
    function topAlarm(alarms) {
      var all = (alarms || []).slice().sort(function (a, b) {
        return priorityOf(a) - priorityOf(b);
      });
      return all.length ? all[0] : null;
    }

    silenceBtn.addEventListener("click", function () {
      var active = sortedActive(_lastAlarms);
      if (!active.length) return;
      silenceBtn.disabled = true;
      Promise.all(active.map(function (a) {
        return fetch("/api/alarms/ack", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: a.id }),
        });
      }))
        .catch(function (e) { console.error("ack failed:", e); })
        .finally(function () { silenceBtn.disabled = false; });
    });

    function renderStormRow(state) {
      var storm = state.storm || {};
      if (storm.phase == null && storm.risk == null) {
        stormRow.className   = "storm-strip muted";
        stormRow.textContent = "Storm model: waiting for data";
        return;
      }
      var parts = [];
      if (storm.phase) {
        parts.push(storm.phase.charAt(0).toUpperCase() + storm.phase.slice(1));
      }
      if (storm.risk != null) {
        var pct = storm.risk > 1 ? Math.round(storm.risk) : Math.round(storm.risk * 100);
        parts.push("Risk " + pct + "%");
      }
      stormRow.className   = "storm-strip";
      stormRow.textContent = "Storm: " + parts.join(" · ");
    }

    // Mirrors state.py _refresh_status_card — used to keep card text when all alarms are acked
    var CARD_TEXT = {
      "flood:alarm": { title: "Water detected",        action: "Move to higher ground"          },
      "flood:warn":  { title: "Water detected",        action: "Move to higher ground"          },
      "wind:alarm":  { title: "Hurricane-force winds", action: "Go to an interior room now"     },
      "wind:warn":   { title: "High winds",            action: "Stay away from windows"         },
      "storm:alarm": { title: "Severe storm",           action: "Stay indoors, monitor pressure" },
      "storm:warn":  { title: "Storm warning",         action: "Stay indoors, monitor pressure" },
      "heat:alarm":  { title: "Heat warning",          action: "Stay hydrated, find shade"      },
      "heat:warn":   { title: "Heat warning",          action: "Stay hydrated, find shade"      },
    };

    connectState(function (state) {
      if (!state._connected) {
        statusLabel.className   = "status-label err";
        statusLabel.textContent = "● Reconnecting to box...";
        card.className          = "card off";
        cardTitle.textContent  = "Reconnecting…";
        cardAction.textContent = "";
        silenceBtn.style.display       = "none";
        explanationStrip.style.display = "none";
        alarmTags.innerHTML      = "";
        readingsGrid.innerHTML = "";
        stormRow.textContent   = "";
        document.getElementById("net-line").style.display = "none";
        return;
      }

      statusLabel.className   = "status-label ok";
      statusLabel.textContent = "● Connected to box";
      _lastAlarms             = state.alarms || [];

      // Net status line
      var _net   = (state.health || {}).net || {};
      var _netEl = document.getElementById("net-line");
      if (_net.online === true) {
        _netEl.textContent = "● Internet available";
        _netEl.style.color = "#4caf50";
      } else if (_net.online === false) {
        _netEl.textContent = "● No internet · StormBox works offline";
        _netEl.style.color = "#ff9800";
      } else {
        _netEl.textContent = "● Checking connection…";
        _netEl.style.color = "#777";
      }
      _netEl.style.display = "block";

      // Replay banner
      var rp = state.replay || {};
      if (rp.on) {
        replayBannerName.textContent  = _replayNames[rp.file] || rp.file || "storm";
        replayBanner.style.display    = "block";
      } else {
        replayBanner.style.display    = "none";
      }

      var esp32Up = !!(state.health && state.health.esp32_link);
      var active  = sortedActive(_lastAlarms);
      var top     = topAlarm(_lastAlarms);
      var noAlarm = _lastAlarms.length === 0;

      if (!esp32Up) {
        // ESP32 offline — grey card, no alarm controls
        card.className             = "card off" + (noAlarm ? " no-alarm" : "");
        cardTitle.textContent      = "Sensors offline";
        cardAction.textContent     = "Check that the box is plugged in";
        cardSilenced.style.display = "none";
        silenceBtn.style.display   = "none";
        explanationStrip.style.display = "none";
      } else {
        // If any alarm exists (acked or not), derive card text from the top alarm
        // so "All clear" never shows while alarms are still present
        var ct = top ? (CARD_TEXT[top.id + ":" + top.level] || {}) : {};
        cardTitle.textContent  = ct.title  || (state.status_card && state.status_card.title)  || "All clear";
        cardAction.textContent = ct.action || (state.status_card && state.status_card.action) || "";

        // Card color: all alarms (acked or not) set the color; pulse only while un-silenced alarms exist
        var sevClass = !top ? "clear" : (top.level === "alarm" ? "alarm" : "warn");
        card.className = "card " + sevClass + (active.length ? " pulsing" : "") + (noAlarm ? " no-alarm" : "");

        // "Alarm silenced" — show when the top alarm (by priority) is acked
        cardSilenced.style.display = (top && top.acked) ? "block" : "none";

        // Silence button
        silenceBtn.style.display = active.length ? "block" : "none";

        // Explanation strip — show top alarm's explanation text if present
        var expText = top && top.explanation ? top.explanation : "";
        explanationStrip.style.display = expText ? "block" : "none";
        explanationStrip.textContent   = expText;
      }

      renderReadings(state);
      renderStormRow(state);

      // Secondary alarm tags: all alarms sorted (acked or not), everything after the top one
      var allSorted = (_lastAlarms || []).slice().sort(function (a, b) {
        return priorityOf(a) - priorityOf(b);
      });
      if (allSorted.length > 1) {
        alarmTags.innerHTML = allSorted.slice(1).map(function (a) {
          var name  = a.id.charAt(0).toUpperCase() + a.id.slice(1);
          var label = name + " " + (a.level === "alarm" ? "alarm" : "warning");
          if (a.acked) label += " (silenced)";
          return "<span class='alarm-tag " + a.level + (a.acked ? " acked" : "") + "'>+ " + label + "</span>";
        }).join("");
      } else {
        alarmTags.innerHTML = "";
      }
    });
  </script>

</body>
</html>
