<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StormBox · Engineer</title>
  <style>
    :root {
      --bg:      #111;
      --surface: #1e1e1e;
      --text:    #e8e8e8;
      --muted:   #888;
      --green:   #4caf50;
      --red:     #f44336;
      --amber:   #ff9800;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "Cascadia Code", monospace;
      padding: 1.5rem;
      max-width: 1100px;
    }

    /* ── REPLAY banner ── */
    #replay-banner {
      display: none;
      width: calc(100% + 3rem);
      margin: -1.5rem -1.5rem 1.5rem;
      padding: 0.75rem 1.5rem;
      background: #b71c1c;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    h2 {
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .dot     { font-size: 0.9rem; }
    .dot.ok  { color: var(--green); }
    .dot.err { color: var(--red);   }

    /* ── Panel card ── */
    .panel {
      background: var(--surface);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    /* ── Replay controls ── */
    .replay-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    select {
      flex: 1;
      min-width: 220px;
      padding: 0.45rem 0.7rem;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }
    select:focus { outline: 1px solid #666; }

    button {
      padding: 0.45rem 1.1rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
    }
    button:hover:not(:disabled) { background: #2a2a2a; }
    button:disabled { opacity: 0.45; cursor: default; }

    .btn-start { border-color: var(--green); color: var(--green); }
    .btn-stop  { border-color: var(--red);   color: var(--red);   }

    /* ── Progress ── */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    progress {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      appearance: none;
      -webkit-appearance: none;
      background: #333;
      border: none;
    }
    progress::-webkit-progress-bar   { background: #333; border-radius: 4px; }
    progress::-webkit-progress-value { background: var(--amber); border-radius: 4px; }
    progress::-moz-progress-bar      { background: var(--amber); border-radius: 4px; }

    .progress-pct {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
      min-width: 3rem;
      text-align: right;
    }

    /* ── Stat tiles ── */
    .stat-tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .stat-tile {
      background: var(--bg);
      border-radius: 6px;
      padding: 0.75rem 1rem;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.3rem;
    }

    .stat-value { font-size: 1.6rem; font-weight: 700; }

    @media (max-width: 600px) {
      .stat-tiles { grid-template-columns: 1fr 1fr; }
      select { min-width: 100%; }
    }
  </style>
</head>
<body>

  <div id="replay-banner">REPLAY: <span id="banner-name"></span></div>

  <h1>
    StormBox &middot; Engineer view
    <span class="dot err" id="ws-dot">&#x25cf;</span>
  </h1>

  <div class="panel">
    <h2>Replay</h2>
    <div class="replay-controls">
      <select id="replay-select">
        <option value="">Loading storms&hellip;</option>
      </select>
      <button class="btn-start" id="start-btn" disabled>Start</button>
      <button class="btn-stop"  id="stop-btn"  disabled>Stop</button>
    </div>
    <div class="progress-row">
      <progress id="replay-progress" max="100" value="0"></progress>
      <span class="progress-pct" id="replay-pct">0%</span>
    </div>
    <div class="stat-tiles">
      <div class="stat-tile">
        <div class="stat-label">Pressure (hPa)</div>
        <div class="stat-value" id="stat-pressure">&mdash;</div>
      </div>
      <div class="stat-tile">
        <div class="stat-label">Wind (mph)</div>
        <div class="stat-value" id="stat-wind">&mdash;</div>
      </div>
      <div class="stat-tile">
        <div class="stat-label">Storm risk</div>
        <div class="stat-value" id="stat-risk">&mdash;</div>
      </div>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script>
    var wsDot        = document.getElementById("ws-dot");
    var replayBanner = document.getElementById("replay-banner");
    var bannerName   = document.getElementById("banner-name");
    var replaySelect = document.getElementById("replay-select");
    var startBtn     = document.getElementById("start-btn");
    var stopBtn      = document.getElementById("stop-btn");
    var replayProg   = document.getElementById("replay-progress");
    var replayPct    = document.getElementById("replay-pct");
    var statPressure = document.getElementById("stat-pressure");
    var statWind     = document.getElementById("stat-wind");
    var statRisk     = document.getElementById("stat-risk");

    var _nameMap = {};

    fetch("/api/replay/list")
      .then(function (r) { return r.json(); })
      .then(function (list) {
        _nameMap = {};
        replaySelect.innerHTML = list.length
          ? "<option value=\"\">— select a storm —</option>"
          : "<option value=\"\">No storms available</option>";
        list.forEach(function (item) {
          var display = item.storm + " " + item.year + " · " + Math.round(item.min_pressure_hpa) + " hPa";
          _nameMap[item.file] = item.storm + " " + item.year;
          var opt = document.createElement("option");
          opt.value       = item.file;
          opt.textContent = display;
          replaySelect.appendChild(opt);
        });
        startBtn.disabled = false;
      })
      .catch(function (e) {
        replaySelect.innerHTML = "<option value=\"\">Failed to load storms</option>";
        console.error("[engineer] replay list fetch failed:", e);
      });

    startBtn.addEventListener("click", function () {
      var file = replaySelect.value;
      if (!file) return;
      startBtn.disabled = true;
      fetch("/api/replay/start", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ file: file }),
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.error) {
            console.error("[engineer] start failed:", d.error);
            startBtn.disabled = false;
          }
        })
        .catch(function (e) {
          console.error("[engineer] start fetch failed:", e);
          startBtn.disabled = false;
        });
    });

    stopBtn.addEventListener("click", function () {
      stopBtn.disabled = true;
      fetch("/api/replay/stop", { method: "POST" })
        .catch(function (e) {
          console.error("[engineer] stop fetch failed:", e);
          stopBtn.disabled = false;
        });
    });

    connectState(function (state) {
      if (!state._connected) {
        wsDot.className = "dot err";
        return;
      }
      wsDot.className = "dot ok";

      var replay = state.replay || {};
      var on     = !!replay.on;

      // Banner
      if (on) {
        bannerName.textContent     = _nameMap[replay.file] || replay.file || "storm";
        replayBanner.style.display = "block";
      } else {
        replayBanner.style.display = "none";
      }

      // Buttons: disable Start while on, disable Stop while off
      startBtn.disabled = on;
      stopBtn.disabled  = !on;

      // Progress
      var pct = replay.progress || 0;
      replayProg.value      = pct;
      replayPct.textContent = pct + "%";

      // Live stat tiles
      var r  = state.readings || {};
      var st = state.storm    || {};

      statPressure.textContent = r.p    != null ? r.p.toFixed(1)    : "—";
      statWind.textContent     = r.wind != null ? r.wind.toFixed(1) : "—";

      if (st.risk != null) {
        var riskPct = st.risk > 1 ? Math.round(st.risk) : Math.round(st.risk * 100);
        statRisk.textContent = riskPct + "%";
      } else {
        statRisk.textContent = "—";
      }
    });
  </script>
</body>
</html>
