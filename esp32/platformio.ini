; PlatformIO config for the ESP32-WROOM-32D sensor station
; Copy main_esp32.cpp to src/main.cpp

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Serial monitor niceties
monitor_filters = default, time

lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    ; Barometer library (provides SPL07-003.h). Keep whatever line you used
    ; before on the XIAO; if you need to add it, use the Seeed GitHub repo:
    https://github.com/Seeed-Studio/Seeed_Arduino_SPA06.git
    knolleary/PubSubClient